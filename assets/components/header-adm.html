<script>
    // 🔥 LOGOUT - Chamar a função global
    const btnLogout = document.getElementById("btnLogout");
    if (btnLogout) {
        btnLogout.addEventListener("click", function(e) {
            e.preventDefault();
            // Chamar a função fazerLogout que está no auth.js
            if (typeof window.fazerLogout === 'function') {
                window.fazerLogout();
            } else {
                console.error("Função fazerLogout não encontrada");
            }
        });
    }
</script>
