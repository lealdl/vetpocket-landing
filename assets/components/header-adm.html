<header class="adm-header">
    <div class="adm-header-container">
        <span class="adm-logo">VetHome 🐾 ADM</span>
        <button id="mobileMenuBtn" class="adm-menu-toggle" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>
</header>

<aside class="adm-sidebar">
    <nav class="adm-nav">
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-users"></i> Leads Ativos</a></li>
            <li><a href="inativos.html"><i class="fas fa-archive"></i> Leads Inativos</a></li>
            <li><a href="configuracoes.html"><i class="fas fa-cog"></i> Configurações</a></li>
            <!-- 🔥 USANDO onclick DIRETO NO HTML -->
            <li><a href="javascript:void(0)" onclick="mostrarModalLogout()"><i class="fas fa-sign-out-alt"></i> Sair</a></li>
        </ul>
    </nav>
</aside>

<div class="adm-overlay"></div>

<!-- Modais de logout -->
<div id="modalLogoutConfirm" class="modal-confirm" style="display: none;">
    <div class="modal-confirm-content">
        <i class="fas fa-sign-out-alt" style="color: #dc2626; font-size: 48px;"></i>
        <h3>Sair do Sistema</h3>
        <p>Tem certeza que deseja sair? Você precisará fazer login novamente para acessar o painel.</p>
        <div class="modal-confirm-buttons">
            <button class="btn-confirm-no" onclick="fecharModalLogout()">Cancelar</button>
            <button class="btn-confirm-yes" onclick="confirmarLogout()">Sair</button>
        </div>
    </div>
</div>

<div id="modalLogoutLoading" class="modal-confirm" style="display: none;">
    <div class="modal-confirm-content">
        <div class="spinner-logout"></div>
        <h3>Fazendo logout...</h3>
        <p class="loading-text">Aguarde um momento enquanto encerramos sua sessão.</p>
    </div>
</div>

<script>
    // Funções globais para o logout
    window.mostrarModalLogout = function() {
        console.log("🖱️ Mostrando modal de confirmação");
        const modal = document.getElementById('modalLogoutConfirm');
        if (modal) modal.style.display = 'flex';
    };
    
    window.fecharModalLogout = function() {
        console.log("❌ Fechando modal");
        const modal = document.getElementById('modalLogoutConfirm');
        if (modal) modal.style.display = 'none';
    };
    
    window.confirmarLogout = function() {
        console.log("🚪 Confirmando logout...");
        
        // Fechar modal de confirmação
        const modalConfirm = document.getElementById('modalLogoutConfirm');
        if (modalConfirm) modalConfirm.style.display = 'none';
        
        // Mostrar modal de loading
        const modalLoading = document.getElementById('modalLogoutLoading');
        if (modalLoading) modalLoading.style.display = 'flex';
        
        // Pegar token
        const token = localStorage.getItem("auth_token");
        
        // Chamar API de logout
        if (token && typeof API_CONFIG !== 'undefined') {
            fetch(`${API_CONFIG.BASE_URL}logout.php`, {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                credentials: "include"
            }).catch(() => {});
        }
        
        // Limpar localStorage e redirecionar
        setTimeout(() => {
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("auth_token");
            localStorage.removeItem("user_id");
            localStorage.removeItem("user_name");
            
            if (typeof showToast === 'function') {
                showToast("Logout realizado com sucesso!", "success");
            }
            
            setTimeout(() => {
                window.location.href = "login.html";
            }, 500);
        }, 500);
    };
    
    // Menu mobile
    document.addEventListener('DOMContentLoaded', function() {
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.querySelector('.adm-sidebar');
        const overlay = document.querySelector('.adm-overlay');
        
        if (mobileMenuBtn && sidebar && overlay) {
            mobileMenuBtn.addEventListener('click', function() {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            });
            
            overlay.addEventListener('click', function() {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            });
        }
        
        // Fechar modal ao clicar fora
        const modalConfirm = document.getElementById('modalLogoutConfirm');
        if (modalConfirm) {
            modalConfirm.addEventListener('click', function(e) {
                if (e.target === this) {
                    window.fecharModalLogout();
                }
            });
        }
    });
</script>
