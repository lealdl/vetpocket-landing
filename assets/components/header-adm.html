<!-- Modais de logout -->
<div id="modalLogoutConfirm" class="modal-confirm" style="display: none;">
    <div class="modal-confirm-content">
        <i class="fas fa-sign-out-alt" style="color: #dc2626; font-size: 48px;"></i>
        <h3>Sair do Sistema</h3>
        <p>Tem certeza que deseja sair? Você precisará fazer login novamente para acessar o painel.</p>
        <div class="modal-confirm-buttons">
            <button class="btn-confirm-no" id="btnCancelLogout">Cancelar</button>
            <button class="btn-confirm-yes" id="btnConfirmLogout">Sair</button>
        </div>
    </div>
</div>

<div id="modalLogoutLoading" class="modal-confirm" style="display: none;">
    <div class="modal-confirm-content">
        <div class="spinner-logout"></div>
        <h3>Fazendo logout...</h3>
        <p class="loading-text">Aguarde um momento enquanto encerramos sua sessão.</p>
    </div>
</div>

<script>
    // Função de logout com modal personalizado
    function fazerLogout() {
        // Esconder modal de confirmação
        const modalConfirm = document.getElementById('modalLogoutConfirm');
        if (modalConfirm) modalConfirm.style.display = 'none';
        
        // Mostrar modal de loading
        const modalLoading = document.getElementById('modalLogoutLoading');
        if (modalLoading) modalLoading.style.display = 'flex';
        
        // Pegar token antes de remover
        const token = localStorage.getItem("auth_token");
        
        // Chamar API de logout para invalidar token (opcional)
        if (token) {
            fetch(`${API_CONFIG.BASE_URL}logout.php`, {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                credentials: "include"
            }).catch((error) => {
                console.error("Erro ao chamar logout.php:", error);
            });
        }
        
        // Limpar localStorage após 500ms
        setTimeout(() => {
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("auth_token");
            localStorage.removeItem("user_id");
            localStorage.removeItem("user_name");
            
            // Mostrar toast de sucesso
            if (typeof showToast === 'function') {
                showToast("Logout realizado com sucesso!", "success");
            }
            
            // Redirecionar para login
            setTimeout(() => {
                window.location.href = "login.html";
            }, 500);
        }, 500);
    }
    
    // Aguardar o DOM carregar completamente antes de configurar os eventos
    document.addEventListener('DOMContentLoaded', function() {
        // Configurar o botão de logout
        const btnLogout = document.getElementById("btnLogoutSair");
        if (btnLogout) {
            btnLogout.addEventListener("click", function(e) {
                e.preventDefault();
                // Mostrar modal de confirmação
                const modalConfirm = document.getElementById('modalLogoutConfirm');
                if (modalConfirm) modalConfirm.style.display = 'flex';
            });
        }
        
        // Configurar botão cancelar
        const btnCancel = document.getElementById('btnCancelLogout');
        if (btnCancel) {
            btnCancel.addEventListener('click', function() {
                const modalConfirm = document.getElementById('modalLogoutConfirm');
                if (modalConfirm) modalConfirm.style.display = 'none';
            });
        }
        
        // Configurar botão confirmar
        const btnConfirm = document.getElementById('btnConfirmLogout');
        if (btnConfirm) {
            btnConfirm.addEventListener('click', function() {
                fazerLogout();
            });
        }
        
        // Fechar modal ao clicar fora
        const modalConfirm = document.getElementById('modalLogoutConfirm');
        if (modalConfirm) {
            modalConfirm.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.style.display = 'none';
                }
            });
        }
    });
</script>
