<!DOCTYPE html>
<script>
    // 🔥 CORRIGIDO: Caminho absoluto
    if (localStorage.getItem("isLoggedIn") !== "true") {
        window.location.replace("/login.html");
    }
</script>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads Arquivados | VetPocket</title>
    <link rel="stylesheet" href="../../assets/css/toast.css">
    <link rel="stylesheet" href="../../assets/css/leads.css">
    <link rel="stylesheet" href="../../assets/adm/adm-dashboard.css?v=1.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <div class="adm-overlay" id="menuOverlay"></div>
    
    <main class="container adm-content">
        <div class="header-actions">
            <h1><i class="fas fa-archive"></i> Leads Arquivados</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="btnRestaurar" class="btn-arquivar" style="display: none; background-color: #10b981;">
                    <i class="fas fa-undo"></i> Restaurar Selecionados
                </button>
            </div>
        </div>

        <!-- Cards de estatísticas -->
        <div class="dashboard-stats">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Total Arquivados</span>
                    <h2 id="stat-total">0</h2>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #e6fffa; color: #38b2ac;"><i class="fas fa-home"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Só Homecare</span>
                    <h2 id="stat-homecare">0</h2>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #ebf8ff; color: #3182ce;"><i class="fas fa-hospital"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Clínica Fixa</span>
                    <h2 id="stat-clinica">0</h2>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #fff5f5; color: #e53e3e;"><i class="fas fa-rocket"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Perfil Misto</span>
                    <h2 id="stat-misto">0</h2>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table id="leadsTable">
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" id="selectAll"></th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>WhatsApp</th>
                            <th class="desktop-only">Perfil</th>
                            <th class="desktop-only">Data de Cadastro</th>
                        </tr>
                    </thead>
                    <tbody id="leads-table-body">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal de Visualização -->
    <div class="adm-modal" id="modalEdicao">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Detalhes do Lead Arquivado</h2>
                <button onclick="fecharModal()" class="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formEdicaoLead">
                    <input type="hidden" id="modalId">
                    <label>Nome:</label>
                    <input type="text" id="inputNome" class="adm-input">
                    <label>E-mail:</label>
                    <input type="email" id="inputEmail" class="adm-input">
                    <label>WhatsApp:</label>
                    <input type="text" id="inputTelefone" class="adm-input">
                    <label>Perfil:</label>
                    <input type="text" id="inputPerfil" class="adm-input" readonly style="background:#f4f4f4">
                    <label>Status Especial:</label>
                    <select id="inputStatusEspecial" class="adm-input">
                        <option value="Nenhum">Nenhum</option>
                        <option value="Vaga Garantida">⭐ Vaga Garantida</option>
                        <option value="Lista de Espera">⏳ Lista de Espera</option>
                        <option value="Usuário Beta">🚀 Usuário Beta</option>
                    </select>
                    <label>Motivo do Arquivamento:</label>
                    <textarea id="inputMotivoArquivamento" class="adm-input" rows="2" readonly style="background:#f4f4f4"></textarea>
                    <label>Notas Internas:</label>
                    <textarea id="inputNotas" class="adm-input" rows="3"></textarea>
                    <p><strong>Cadastrado em:</strong> <span id="modalData"></span></p>
                    <div class="actions">
                        <button type="submit" class="btn-save" style="display:none">Salvar</button>
                        <a id="btnWhatsapp" href="#" target="_blank" class="btn-whatsapp">
                            <i class="fab fa-whatsapp"></i> Falar no WhatsApp
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/toast.js"></script>
    <script src="../../assets/js/adm/components.js"></script>
    <script src="../../assets/js/adm/inativos.js"></script>

    <script>
        async function initAdmin() {
            const placeholder = document.getElementById("header-placeholder");
            const url = "../../assets/components/header-adm.html";
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Erro ${response.status}`);
                const html = await response.text();
                placeholder.innerHTML = html;
                if (typeof setupHeaderInteractions === "function") setupHeaderInteractions();
            } catch (error) {
                console.error("❌ Erro:", error);
            }
        }
        initAdmin();
    </script>
    <!-- Adicione antes do fechamento do body em inativos.html -->
<script>
    // 🔥 FUNÇÕES DE LOGOUT GLOBAIS (definidas antes do header carregar)
    window.mostrarModalLogout = function() {
        console.log("🖱️ Mostrando modal de confirmação");
        const modal = document.getElementById('modalLogoutConfirm');
        if (modal) modal.style.display = 'flex';
    };
    
    window.fecharModalLogout = function() {
        console.log("❌ Fechando modal");
        const modal = document.getElementById('modalLogoutConfirm');
        if (modal) modal.style.display = 'none';
    };
    
    window.confirmarLogout = function() {
        console.log("🚪 Confirmando logout...");
        
        const modalConfirm = document.getElementById('modalLogoutConfirm');
        if (modalConfirm) modalConfirm.style.display = 'none';
        
        const modalLoading = document.getElementById('modalLogoutLoading');
        if (modalLoading) modalLoading.style.display = 'flex';
        
        const token = localStorage.getItem("auth_token");
        
        if (token && typeof API_CONFIG !== 'undefined') {
            fetch(`${API_CONFIG.BASE_URL}logout.php`, {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                credentials: "include"
            }).catch(() => {});
        }
        
        setTimeout(() => {
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("auth_token");
            localStorage.removeItem("user_id");
            localStorage.removeItem("user_name");
            
            if (typeof showToast === 'function') {
                showToast("Logout realizado com sucesso!", "success");
            }
            
            setTimeout(() => {
                window.location.href = "login.html";
            }, 500);
        }, 500);
    };
    
    console.log("✅ Funções de logout registradas globalmente");
</script>
</body>

</html>
